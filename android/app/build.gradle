plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.adaz.shell'
    compileSdk 35

    defaultConfig {
        // ADAZ Personal is the primary app. Family is an integrated screen
        // served from the same trusted origin and WebView storage context.
        applicationId 'com.adaz.personal'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        resValue 'string', 'app_name', 'ADAZ'
        buildConfigField 'String', 'START_URL', '"https://diazaalejo8-star.github.io/Adaz/index.html"'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
