plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.adaz.shell'
    compileSdk 35

    defaultConfig {
        applicationId 'com.adaz.personal'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }

    flavorDimensions += 'edition'
    productFlavors {
        personal {
            dimension 'edition'
            applicationId 'com.adaz.personal'
            versionCode 4
            versionName '1.3.0'
            resValue 'string', 'app_name', 'ADAZ'
            buildConfigField 'String', 'START_URL', '"https://diazaalejo8-star.github.io/Adaz/index.html"'
            buildConfigField 'String', 'AUTH_SCHEME', '"adazpersonal"'
            buildConfigField 'String', 'AUTH_REDIRECT_URI', '"adazpersonal://auth-callback"'
            manifestPlaceholders = [authScheme: 'adazpersonal']
        }
        family {
            dimension 'edition'
            applicationId 'com.adaz.family'
            versionCode 4
            versionName '1.3.0'
            resValue 'string', 'app_name', 'ADAZ Family'
            buildConfigField 'String', 'START_URL', '"https://diazaalejo8-star.github.io/Adaz/family.html?role=parent"'
            buildConfigField 'String', 'AUTH_SCHEME', '"adazfamily"'
            buildConfigField 'String', 'AUTH_REDIRECT_URI', '"adazfamily://auth-callback"'
            manifestPlaceholders = [authScheme: 'adazfamily']
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
