plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.adaz.shell'
    compileSdk 35

    defaultConfig {
        applicationId 'com.adaz.family'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        resValue 'string', 'app_name', 'ADAZ Family'
        buildConfigField 'String', 'START_URL', '"https://diazaalejo8-star.github.io/Adaz/family.html"'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
