name: Build ADAZ Personal + ADAZ Family APKs

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'family.html'
      - 'adaz-family.js'
      - 'adaz-family-link.js'
      - 'manifest*.webmanifest'
      - 'sw.js'
      - 'adaz-*.js'
      - 'adaz-*.css'
      - '.github/workflows/build-adaz-apks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check every ADAZ JavaScript module
        run: |
          for file in adaz-*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Build separate Personal and Family debug APKs
        working-directory: android
        run: gradle --no-daemon assemblePersonalDebug assembleFamilyDebug

      - name: Verify APK version metadata
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          for APK in \
            android/app/build/outputs/apk/personal/debug/app-personal-debug.apk \
            android/app/build/outputs/apk/family/debug/app-family-debug.apk; do
            "$AAPT" dump badging "$APK" | grep -F "versionCode='10' versionName='1.3.6'"
            sha256sum "$APK"
          done

      - name: Upload both separate APKs
        uses: actions/upload-artifact@v4
        with:
          name: ADAZ-v1.3.6-Personal-and-Family-APKs
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/personal/debug/app-personal-debug.apk
            android/app/build/outputs/apk/family/debug/app-family-debug.apk
          retention-days: 30
