name: Build ADAZ Personal and Family APKs

on:
  push:
    branches: [main, adaz-family-v1]
    paths:
      - 'android/**'
      - 'index.html'
      - 'family.html'
      - 'adaz-family.js'
      - 'adaz-family-link.js'
      - 'manifest*.webmanifest'
      - 'adaz-*.js'
      - 'adaz-*.css'
      - '.github/workflows/build-adaz-apks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'family.html'
      - 'adaz-family.js'
      - 'adaz-family-link.js'
      - 'manifest*.webmanifest'
      - 'adaz-*.js'
      - 'adaz-*.css'
      - '.github/workflows/build-adaz-apks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check JavaScript syntax
        run: |
          node --check adaz-family.js
          node --check adaz-family-link.js
          node --check adaz-academy-curriculum.js
          node --check adaz-year-plan.js
          node --check adaz-academy.js
          node --check adaz-integrations.js
          node --check adaz-extra.js

      - name: Build both debug APKs
        working-directory: android
        run: gradle --no-daemon assemblePersonalDebug assembleFamilyDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ADAZ-Personal-and-Family-APKs
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/personal/debug/app-personal-debug.apk
            android/app/build/outputs/apk/family/debug/app-family-debug.apk
          retention-days: 30
