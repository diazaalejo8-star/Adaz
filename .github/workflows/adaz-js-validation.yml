name: Validate ADAZ JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Get ADAZ source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check external JavaScript modules
        run: |
          for file in adaz-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check JavaScript embedded in index.html
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline scripts found in index.html")
          for number, source in enumerate(scripts, 1):
              Path(f"/tmp/adaz-inline-{number}.js").write_text(source, encoding="utf-8")
              print(f"Extracted inline script {number}")
          PY
          for file in /tmp/adaz-inline-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Guard navigation and mobile layout
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          css = Path("adaz-apple.css").read_text(encoding="utf-8")
          sw = Path("sw.js").read_text(encoding="utf-8")

          if re.search(r"(?<!\$)\$\([^)]*\)\.forEach", html):
              raise SystemExit("Navigation regression: single-element selector used with forEach")
          if "$$('.nav-btn[data-page]').forEach" not in html:
              raise SystemExit("Navigation regression: multi-element selector is missing")

          bottom = re.search(r'<nav class="bottom-nav" id="bottomNav">(.*?)</nav>', html, re.S)
          if not bottom:
              raise SystemExit("Mobile navigation was not found")
          tabs = re.findall(r'class="nav-btn"', bottom.group(1))
          if len(tabs) != 5:
              raise SystemExit(f"Expected 5 mobile tabs, found {len(tabs)}")
          if 'data-page="training"' in bottom.group(1):
              raise SystemExit("Health should live inside More, not overflow the tab bar")
          if 'data-page="training"><span>⌁</span><b>ADAZ Health' not in html:
              raise SystemExit("Health shortcut is missing from the More hub")

          if "grid-template-columns:repeat(5,minmax(0,1fr))" not in css:
              raise SystemExit("iPhone-style five-column tab bar is missing")
          if "grid-auto-columns:100%" not in css:
              raise SystemExit("Full-width swipe cards are missing")
          if "adaz-shell-v28" not in sw:
              raise SystemExit("Service worker cache version was not refreshed")

          print("Navigation, five-tab layout and swipe-card checks passed.")
          PY
