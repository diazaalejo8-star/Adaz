name: Validate ADAZ JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Get ADAZ source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check external JavaScript modules
        run: |
          for file in adaz-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check JavaScript embedded in index.html
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline scripts found in index.html")
          for number, source in enumerate(scripts, 1):
              Path(f"/tmp/adaz-inline-{number}.js").write_text(source, encoding="utf-8")
              print(f"Extracted inline script {number}")
          PY
          for file in /tmp/adaz-inline-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Guard navigation and mobile layout
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          css = Path("adaz-apple.css").read_text(encoding="utf-8")
          sw = Path("sw.js").read_text(encoding="utf-8")

          if re.search(r"(?<!\$)\$\([^)]*\)\.forEach", html):
              raise SystemExit("Navigation regression: single-element selector used with forEach")
          if "$$('.nav-btn[data-page]').forEach" not in html:
              raise SystemExit("Navigation regression: multi-element selector is missing")

          bottom = re.search(r'<nav class="bottom-nav" id="bottomNav">(.*?)</nav>', html, re.S)
          if not bottom:
              raise SystemExit("Mobile navigation was not found")
          tabs = re.findall(r'class="nav-btn(?: active)?"', bottom.group(1))
          if len(tabs) != 5:
              raise SystemExit(f"Expected 5 mobile tabs, found {len(tabs)}")
          if 'data-page="training"' in bottom.group(1):
              raise SystemExit("Health should live inside More, not overflow the tab bar")
          if 'data-page="training"><span>⌁</span><b>ADAZ Health' not in html:
              raise SystemExit("Health shortcut is missing from the More hub")

          if "grid-template-columns:repeat(5,minmax(0,1fr))" not in css:
              raise SystemExit("iPhone-style five-column tab bar is missing")
          experience = Path("adaz-experience.js").read_text(encoding="utf-8")
          if "Tu siguiente paso" not in experience or "data-ae-toggle" not in experience:
              raise SystemExit("The one-step-at-a-time experience is missing")
          if "home-extra-row" not in html or "home-stats" not in html:
              raise SystemExit("The simplified home layout is missing")
          if "adaz-shell-v34" not in sw:
              raise SystemExit("Service worker cache version was not refreshed")

          academy = Path("adaz-academy.js").read_text(encoding="utf-8")
          for area in ["Oro Laminado", "Medicina", "ICFES · Saber 11", "IELTS Academic"]:
              if area not in academy:
                  raise SystemExit(f"Study path is missing: {area}")
          if len(re.findall(r"id:'[bmei][0-9]+'", academy)) < 26:
              raise SystemExit("The interactive study library is incomplete")
          if "Ingeniería Financiera" in academy:
              raise SystemExit("The removed study path reappeared")

          for track in ["business", "medicine", "icfes", "ielts"]:
              test = re.search(rf"tracks\.{track}\.test=\[(.*?)\];", academy, re.S)
              review = re.search(rf"tracks\.{track}\.review=\[(.*?)\];", academy, re.S)
              if not test or len(re.findall(r"\{tag:", test.group(1))) < 8:
                  raise SystemExit(f"The {track} challenge test is incomplete")
              if not review or len(re.findall(r"\{title:", review.group(1))) < 5:
                  raise SystemExit(f"The {track} review guide is incomplete")
          if "goalPanel()" not in academy or "data-s2-save-goals" not in academy:
              raise SystemExit("The personal IELTS/ICFES goal tracker is missing")
          if "adaz-goals-tracker-v1" not in academy:
              raise SystemExit("The personal score history key is missing")
          for phrase in ["brought forward by two days", "Ganancia antes de costos fijos", "pH 3"]:
              if phrase not in academy:
                  raise SystemExit(f"Study question regression: {phrase}")
          if "adaz-commercial-theme" not in html:
              raise SystemExit("The commercial visual theme is missing")
          if "spotifyClientId" in html or "connectSpotify" in html:
              raise SystemExit("Spotify developer controls should not be exposed in the personal app")

          print("Navigation, commercial theme, 4 study paths, review guides and 32 challenge questions passed.")
          PY
