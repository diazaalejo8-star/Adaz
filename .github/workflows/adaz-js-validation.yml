name: Validate ADAZ JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Get ADAZ source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check external JavaScript modules
        run: |
          for file in adaz-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check JavaScript embedded in index.html
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline scripts found in index.html")
          for number, source in enumerate(scripts, 1):
              Path(f"/tmp/adaz-inline-{number}.js").write_text(source, encoding="utf-8")
              print(f"Extracted inline script {number}")
          PY
          for file in /tmp/adaz-inline-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Guard navigation and mobile layout
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          css = Path("adaz-apple.css").read_text(encoding="utf-8")
          sw = Path("sw.js").read_text(encoding="utf-8")
          if 'id="adaz-android-layout-fix"' not in html:
              raise SystemExit("Android safe-area layout overrides are missing from the final document cascade")
          layout = html.split('id="adaz-android-layout-fix"', 1)[1].split("</style>", 1)[0]
          for rule in ["overflow:visible!important", "flex-direction:column", "padding:18px 16px calc(132px", "#bottomNav.bottom-nav"]:
              if rule not in layout:
                  raise SystemExit(f"Android viewport regression: missing {rule}")
          if "width:100%" not in layout or "min-width:0" not in layout:
              raise SystemExit("Android content must use the full viewport width without flex overflow")
          activity = Path("android/app/src/main/java/com/adaz/shell/MainActivity.kt").read_text(encoding="utf-8")
          if "WindowInsets.Type.displayCutout()" not in activity:
              raise SystemExit("Android display-cutout insets are not handled")
          build = Path("android/app/build.gradle").read_text(encoding="utf-8")
          if build.count("versionCode 8") != 3 or "versionName '1.3.4'" not in build:
              raise SystemExit("Android update version must be 1.3.4 / versionCode 8")
          if "const CACHE = 'adaz-shell-v56';" not in sw:
              raise SystemExit("Android layout release must refresh the offline cache")

          if re.search(r"(?<!\$)\$\([^)]*\)\.forEach", html):
              raise SystemExit("Navigation regression: single-element selector used with forEach")
          if "$$('.nav-btn[data-page]').forEach" not in html:
              raise SystemExit("Navigation regression: multi-element selector is missing")

          bottom = re.search(r'<nav class="bottom-nav" id="bottomNav">(.*?)</nav>', html, re.S)
          if not bottom:
              raise SystemExit("Mobile navigation was not found")
          tabs = re.findall(r'class="nav-btn(?: active)?"', bottom.group(1))
          if len(tabs) != 5:
              raise SystemExit(f"Expected 5 mobile tabs, found {len(tabs)}")
          if 'data-page="training"' in bottom.group(1):
              raise SystemExit("Health should live inside More, not overflow the tab bar")
          if 'data-page="training"><span>⌁</span><b>ADAZ Health' not in html:
              raise SystemExit("Health shortcut is missing from the More hub")

          if "grid-template-columns:repeat(5,minmax(0,1fr))" not in css:
              raise SystemExit("iPhone-style five-column tab bar is missing")
          experience = Path("adaz-experience.js").read_text(encoding="utf-8")
          if "Tu siguiente paso" not in experience or "data-ae-toggle" not in experience:
              raise SystemExit("The one-step-at-a-time experience is missing")
          if "home-extra-row" not in html or "home-stats" not in html:
              raise SystemExit("The simplified home layout is missing")

          head = html.split("</head>", 1)[0]
          if '<link rel="stylesheet" href="adaz-apple.css"' not in head or head.index('<link rel="stylesheet" href="adaz-apple.css"') < head.rfind("</style>"):
              raise SystemExit("Dark theme stylesheet must load after legacy inline styles")
          if 'data-page="training"' not in html.split('<nav class="bottom-nav"', 1)[0]:
              raise SystemExit("ADAZ Health must be directly accessible in the main navigation")
          if "home-health-card" not in html or "Día 1 Full Body" not in html or "Día 4 Lower" not in html:
              raise SystemExit("ADAZ Health summary is missing from the home screen")
          training = Path("adaz-personal-finance-training.js").read_text(encoding="utf-8")
          for label in ["Día 1 · Full Body A", "Día 2 · Upper", "Día 3 · Full Body B", "Día 4 · Lower"]:
              if label not in training:
                  raise SystemExit(f"New four-day split is missing: {label}")
          build_workflow = Path(".github/workflows/build-adaz-apks.yml").read_text(encoding="utf-8")
          if "app-personal-debug.apk" not in build_workflow or "app-family-debug.apk" not in build_workflow or "actions/upload-artifact@v4" not in build_workflow:
              raise SystemExit("Downloadable PC APK artifact packaging is missing")
          if "const CACHE = 'adaz-shell-v56';" not in sw:
              raise SystemExit("Service worker cache version was not refreshed")

          family_js = Path("adaz-family.js").read_text(encoding="utf-8")
          family_html = Path("family.html").read_text(encoding="utf-8")
          integrations = Path("adaz-integrations.js").read_text(encoding="utf-8")
          if "DEFAULT_SUPABASE_URL='https://sychkzfjfgllxzsbhxoz.supabase.co'" not in family_js or "DEFAULT_SUPABASE_KEY='sb_publishable_" not in family_js:
              raise SystemExit("ADAZ Family must be preconfigured for the connected Supabase project")
          if "DEFAULT_SUPABASE_URL = 'https://sychkzfjfgllxzsbhxoz.supabase.co'" not in integrations or "DEFAULT_SUPABASE_KEY = 'sb_publishable_" not in integrations:
              raise SystemExit("ADAZ Personal must be preconfigured for the connected Supabase project")
          if 'id="editConfig"' not in family_html or "editConfig" not in family_js:
              raise SystemExit("Family project settings must remain accessible after automatic setup")
          if "adaz_usage_snapshots" not in family_js or "active_app" not in family_js or "parentUsage" not in family_html:
              raise SystemExit("ADAZ TRUST live usage sharing is incomplete")

          if "selectedMode(appRole)" not in family_js:
              raise SystemExit("ADAZ Family must open the panel matching its app role")
          if 'data-perm="study"' in family_js or 'data-perm="outings"' in family_js or "publishSummary" in family_js:
              raise SystemExit("ADAZ Family must expose only the usage permission")
          if "parentSummaries" in family_html or "parentOutings" in family_html or "Resumen compartido" in family_html:
              raise SystemExit("ADAZ Family still exposes legacy summary or outing panels")
          if "captured_at" not in family_js or "Sin actualización reciente" not in family_js:
              raise SystemExit("ADAZ TRUST stale-data handling is missing")
          if "function hasUsagePermission(" not in family_js or "x.child_id===userId&&x.status==='active'&&x.permissions?.usage===true" not in family_js:
              raise SystemExit("ADAZ Family must preserve consent only across active parent links")
          if "if(!s){stopUsageLoop();links=[];if(mode==='student')window.ADAZNative?.stopUsageMonitor?.();}" not in family_js:
              raise SystemExit("ADAZ Family must stop polling and student monitoring when the session ends")
          if "x.status==='active'&&x.permissions?.usage===true" not in family_js:
              raise SystemExit("ADAZ Family consent display must ignore revoked links")
          if ".update({permissions:p}).eq('child_id',session.user.id).eq('status','active')" not in family_js:
              raise SystemExit("ADAZ Family may only update consent on active links")
          if ".update({permissions:p}).eq('child_id',session.user.id)" not in family_js:
              raise SystemExit("ADAZ Family must apply the usage permission to every active parent link")

          exam_runner = '<script src="./adaz-calendar-tests.js"></script>'
          year_plan_script = '<script src="./adaz-year-plan.js"></script>'
          if exam_runner not in html or year_plan_script not in html or html.index(exam_runner) < html.index(year_plan_script):
              raise SystemExit("Calendar assessment player must load after the year plan")
          if "'./adaz-calendar-tests.js'" not in sw:
              raise SystemExit("Calendar assessment player is missing from the offline shell cache")
          if "'./adaz-academy-quests.js'" not in sw or '<script src="./adaz-academy-quests.js"></script>' not in html:
              raise SystemExit("Interactive Academy quests must load online and offline")


          operating_system = Path("adaz-operating-system.js").read_text(encoding="utf-8")
          if ".os-dashboard" not in css or ".os-review-form" not in css or ".os-plan + .grid.two" not in css:
              raise SystemExit("The unified operating system must have responsive, non-duplicated presentation styles")
          if '<script src="./adaz-operating-system.js"></script>' not in html or "'./adaz-operating-system.js'" not in sw:
              raise SystemExit("The unified ADAZ operating system must load online and offline")
          for phrase in ["ADAZ · SISTEMA OPERATIVO", "Tu programación de hoy", "Gimnasio · Día 1 Full Body", "Gimnasio · Día 2 Upper", "Gimnasio · Día 3 Full Body", "Gimnasio · Día 4 Lower", "no se acumula automáticamente"]:
              if phrase not in operating_system:
                  raise SystemExit(f"Operating-system regression: missing {phrase}")
          for phrase in ["Revisión semanal ADAZ", "ICFES · Matemáticas", "Medicina · ", "Oro Laminado · control operativo"]:
              if phrase not in operating_system:
                  raise SystemExit(f"Weekly-program regression: missing {phrase}")
          if "06:30–13:45" in html or "miércoles hasta 16:30" in html:
              raise SystemExit("An expired school timetable must not be shown as current")

          goal_tracker = Path("adaz-academy.js").read_text(encoding="utf-8")
          operating_system = Path("adaz-operating-system.js").read_text(encoding="utf-8")
          for phrase in ["adaz-goals-tracker-v1", "adaz-calendar-exam-results-v1", "function goalSnapshot()", "function goalEvidenceHTML()", "No convierte porcentajes de preguntas cortas"]:
              if phrase not in operating_system:
                  raise SystemExit(f"Goal evidence engine missing: {phrase}")
          for phrase in ["goal-icfes-evidence", "goal-ielts-evidence", "simulacro completo con escala 0–500", "self-estimate"]:
              if phrase not in goal_tracker:
                  raise SystemExit(f"Goal tracker provenance missing: {phrase}")
          if "La meta se revisa por habilidad" not in goal_tracker:
              raise SystemExit("IELTS goal must be checked skill by skill, not only by overall average")
          if ".os-evidence-grid" not in css or ".os-goal-glance" not in css:
              raise SystemExit("Responsive goal evidence styles are missing")

          goal_tracker = Path("adaz-academy.js").read_text(encoding="utf-8")
          operating_system = Path("adaz-operating-system.js").read_text(encoding="utf-8")
          if "intervals=[1,3,7,14]" not in goal_tracker or "reviewStage" not in goal_tracker or "reviewAt:plus(intervals[stage])" not in goal_tracker:
              raise SystemExit("Academy must schedule progressive 1/3/7/14-day retrieval reviews")
          if "Programa recuperaciones progresivas a 1, 3, 7 y 14 días" not in operating_system:
              raise SystemExit("The planner must explain the actual spaced-review schedule")
          calendar_tests = Path("adaz-calendar-tests.js").read_text(encoding="utf-8")
          if "'+advice+'" not in calendar_tests or "Qué revisar a continuación" not in calendar_tests:
              raise SystemExit("Assessment area recommendations must be visible on the results screen")
          if "adaz-calendar-exam-results-v1" not in calendar_tests or "ICFES Saber 11 · diagnóstico integrado ADAZ" not in calendar_tests:
              raise SystemExit("The integrated calendar exam player is missing")

          integrations = Path("adaz-integrations.js").read_text(encoding="utf-8")
          experience = Path("adaz-experience.js").read_text(encoding="utf-8")
          jacob_function = Path("supabase/functions/adaz-planner/index.ts").read_text(encoding="utf-8")
          supabase_config = Path("supabase/config.toml").read_text(encoding="utf-8")
          if 'Deno.env.get("ADAZ_ENABLE_JACOB") !== "true"' not in jacob_function:
              raise SystemExit("The JACOB server endpoint must stay paused unless explicitly enabled")
          if "[functions.adaz-planner]" not in supabase_config or "verify_jwt = true" not in supabase_config:
              raise SystemExit("The JACOB endpoint must require gateway JWT verification")
          if 'id="aiPromptForm"' in html or 'id="aiQuestion"' in html or 'id="aiDataConsent"' in html:
              raise SystemExit("The paused JACOB copilot must not appear in the UI")
          if "const AI_COPILOT_ENABLED = false;" not in integrations or "if (!AI_COPILOT_ENABLED)" not in integrations:
              raise SystemExit("The JACOB endpoint must remain disabled")
          if "Habla con JACOB" in experience or "#aiQuestion" in experience:
              raise SystemExit("More still links to the paused JACOB copilot")
          year_plan = Path("adaz-year-plan.js").read_text(encoding="utf-8")
          if "Gimnasio C" in year_plan or "Gimnasio D" in year_plan:
              raise SystemExit("The outdated gym labels reappeared in the calendar")
          if "'2026-12-05':['ICFES · práctica oficial Saber 11'" in year_plan or "'2026-12-05':['ICFES · práctica ADAZ por áreas'" not in year_plan or "no una prueba oficial" not in year_plan:
              raise SystemExit("The December ADAZ practice must be labelled as original, not official")

          academy = Path("adaz-academy.js").read_text(encoding="utf-8")
          for area in ["Oro Laminado", "Medicina", "ICFES · Saber 11", "IELTS Academic"]:
              if area not in academy:
                  raise SystemExit(f"Study path is missing: {area}")
          if len(re.findall(r"id:'[bmei][0-9]+'", academy)) < 26:
              raise SystemExit("The interactive study library is incomplete")
          if "track.test=[]" in academy or "delete lesson.q" in academy:
              raise SystemExit("Interactive Academy lessons and question banks must remain enabled")
          if "window.ADAZExamBank" not in Path("adaz-calendar-tests.js").read_text(encoding="utf-8") or "adaz-question-rotation-v1" not in Path("adaz-calendar-tests.js").read_text(encoding="utf-8"):
              raise SystemExit("Assessment question rotation must persist and avoid immediate repeats")
          if "Abrir clase" not in Path("adaz-academy-curriculum.js").read_text(encoding="utf-8") or "data-curr-answer" not in Path("adaz-academy-curriculum.js").read_text(encoding="utf-8"):
              raise SystemExit("Curriculum modules must open interactive lessons with knowledge checks")
          if "wordPick()" not in Path("adaz-academy-quests.js").read_text(encoding="utf-8") or "usedWords" not in Path("adaz-academy-quests.js").read_text(encoding="utf-8"):
              raise SystemExit("Word Quest must rotate words without repeating until the pool is exhausted")
          if "Ingeniería Financiera" in academy:
              raise SystemExit("The removed study path reappeared")

          for track in ["business", "medicine", "icfes", "ielts"]:
              test = re.search(rf"tracks\.{track}\.test=\[(.*?)\];", academy, re.S)
              review = re.search(rf"tracks\.{track}\.review=\[(.*?)\];", academy, re.S)
              if not test or len(re.findall(r"\{tag:", test.group(1))) < 8:
                  raise SystemExit(f"The {track} challenge test is incomplete")
              if not review or len(re.findall(r"\{title:", review.group(1))) < 5:
                  raise SystemExit(f"The {track} review guide is incomplete")
          if "goalPanel()" not in academy or "data-s2-save-goals" not in academy:
              raise SystemExit("The personal IELTS/ICFES goal tracker is missing")
          if "adaz-goals-tracker-v1" not in academy:
              raise SystemExit("The personal score history key is missing")
          for phrase in ["brought forward by two days", "Ganancia antes de costos fijos", "pH 3"]:
              if phrase not in academy:
                  raise SystemExit(f"Study question regression: {phrase}")
          if "data-cop-input" not in html or "const copValue" not in html or "const formatCOP" not in html:
              raise SystemExit("COP inputs must accept exact whole-peso amounts and format Colombian thousands separators")
          finance = Path("adaz-personal-finance-training.js").read_text(encoding="utf-8")
          business_health = Path("adaz-business-health.js").read_text(encoding="utf-8")
          if "data-cop-input" not in finance or "copValue(v.get('amount'))" not in finance or "copValue(v.get('target'))" not in finance:
              raise SystemExit("Personal finance COP inputs must parse exact whole-peso values")
          if "data-cop-input" not in business_health or "copValue(v.get('revenue'))" not in business_health:
              raise SystemExit("Aestel Business COP inputs must parse exact whole-peso values")
          if "const box=$('#adaz-strength-plan')||document.createElement('div')" not in finance or "if(!box.isConnected)p.append(box)" not in finance:
              raise SystemExit("ADAZ Health must replace the obsolete embedded split with the active four-day routine")
          if "adaz-commercial-theme" not in html:
              raise SystemExit("The commercial visual theme is missing")
          if "spotifyClientId" in html or "connectSpotify" in html:
              raise SystemExit("Spotify developer controls should not be exposed in the personal app")

          print("Navigation, commercial theme, 4 study paths, review guides and 32 challenge questions passed.")
          PY
